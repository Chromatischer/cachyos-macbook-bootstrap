[main]
font=JetBrainsMono Nerd Font:size=14
use-bold=yes
dpi-aware=auto
fields=name,generic,comment,categories,filename,keywords,exec
terminal=kitty
prompt=""
placeholder=Search applications…
icon-theme=Papirus-Dark
icons-enabled=yes
show-actions=yes
anchor=center
lines=10
width=50
horizontal-pad=20
vertical-pad=20
inner-pad=5
line-height=30
layer=top
exit-on-keyboard-focus-loss=yes

[colors]
background=1e1e2eff
text=cdd6f4ff
match=89b4faff
selection=313244ff
selection-text=cdd6f4ff
selection-match=cba6f7ff
border=cba6f7ff

[border]
width=2
radius=8

[dmenu]
exit-immediately-if-empty=yes
mode=text

[key-bindings]
execute=Return KP_Enter Control+y

