general {
    hide_cursor = true
    grace = 2
}

background {
    monitor =
    color = rgba(1e1e2eff)
    blur_passes = 3
    blur_size = 8
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(cdd6f4ff)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(a6adc8ff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 55
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 54
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    outer_color = rgba(cba6f7ff)
    inner_color = rgba(313244ee)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Password</span>
    hide_input = false
    rounding = 10
    check_color = rgba(a6e3a1ff)
    fail_color = rgba(f38ba8ff)
    position = 0, -55
    halign = center
    valign = center
}

