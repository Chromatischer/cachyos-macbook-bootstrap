# Portable allow-list from the source setup. Account state and per-project trust
# entries intentionally live outside this file.
approvals_reviewer = "user"
service_tier = "default"
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

[tui]
terminal_title = ["spinner", "project", "status"]
status_line = ["model-with-reasoning", "context-remaining", "current-dir", "five-hour-limit", "weekly-limit"]

[features]
terminal_resize_reflow = true
goals = true

